<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Jokenpô</title>
</head>
<body>
    <div class="container my-5 p-5 mb-4 shadow-lg rounded-3 text-center">
        <h1>Jokenpô</h1>
        <h3>Pedra, papel ou tesoura?</h3>
    </div>

    <div class="container my-5 p-5 mb-4 shadow-lg rounded-3 text-center">
        <div class="d-flex justify-content-center gap-3">
            <button type="button" id="rock" class="btn btn-primary btn-lg">Pedra</button>
            <button type="button" id="paper" class="btn btn-primary btn-lg">Papel</button>
            <button type="button" id="scissors" class="btn btn-primary btn-lg">Tesoura</button>
        </div>

        <br>
        <p id="player-choice" class="fs-4">Você escolheu: <span class="fw-medium">...</span></p>
        <p id="pc-choice" class="fs-4">Computador escolheu: <span class="fw-medium">...</span></p>

        <br>
        <p id="result" class="fs-1 fw-bold" style="color:white">Você (venceu/perdeu)!</p>
    </div>

    <div class="container my-5 p-5 mb-4 shadow-lg rounded-3 text-center">
        <button id="reset" type="button" class="btn btn-secondary btn-lg">Reiniciar</button>
    </div>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
